<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music - Page 1</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="music.html">Music</a>
    <a href="about.html">About</a>
  </nav>
  
  <h1>Music Collection</h1>
  
  <!-- Container for rendering music items -->
  <div id="items-container"></div>

  <!-- Pagination controls -->
  <div id="pagination"></div>
  
  <!-- Sorting and Filtering Controls -->
  <div id="sorting-filter">
    <label for="sort-type">Sort By:</label>
    <select id="sort-type">
      <option value="releaseDate">Release Date</option>
      <option value="rating">Rating</option>
    </select>
    
    <label for="sort-order">Order:</label>
    <select id="sort-order">
      <option value="asc">Ascending</option>
      <option value="desc">Descending</option>
    </select>
    
    <select id="filter-mood">
      <option value="all">All</option>
      <option value="Energetic">Energetic</option>
      <option value="Mellow">Mellow</option>
      <option value="Sad">Sad</option>
      <option value="Poetic">Poetic</option>
    </select>
  </div>

  
  <!-- Form to add new items -->
  <div id="add-item">
    <h2>Add a New Item</h2>
    <form id="add-item-form">
      <input type="text" id="item-name" placeholder="Name" required>
      <input type="number" id="item-release" placeholder="Release Date (YYYYMMDD)" required>
      <input type="number" id="item-rating" placeholder="Rating (1-10)" step="0.1" required>
      <input type="text" id="item-mood" placeholder="Mood (comma separated)" required>
      <input type="text" id="item-image" placeholder="Image filename (in images folder)" required>
      <input type="text" id="item-alt" placeholder="Alt text" required>
      <button type="submit">Add Item</button>
    </form>
  </div>

  <!-- Include data and main JavaScript files -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
